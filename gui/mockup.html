<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing Day GUI mockup</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script type="module">
// Static mockup (GUI-PLAN.md §8 step 1): the real screens with real data from mockup-data.js.
// Routes: #/start (S0), #/overview (S1), #/teams (S2), #/team/<index> (S3), #/save (S4).
// Logos and helmets load from assets/…, so serve it with gui.mjs (the asset library route).
import { page, accentCss } from "./views.js";
import { data } from "./mockup-data.js";

document.documentElement.style.cssText = accentCss(data.plan.userTeam?.colors);
const filters = { tab: "all", q: "", chips: [], sort: "name", dir: 1 };
function render() {
  const [, name = "start", index] = location.hash.match(/^#\/(\w+)(?:\/(\d+))?/) || [];
  const route = name === "save" ? { name: "overview" } : { name, index: index === undefined ? undefined : Number(index) };
  const ui = { plan: data.plan, saves: data.saves, opened: data.opened, picked: data.picked, other: "", busy: "", error: "",
    teams: filters, modal: name === "save" ? {} : null };
  document.getElementById("app").innerHTML = page(route, ui);
  document.title = `Mockup: ${name}`;
}
addEventListener("hashchange", render);
if (!location.hash) location.hash = `#/team/${data.showTeam}`;
render();
</script>
</body>
</html>
